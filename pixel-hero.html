  },
  /* 画布 HUD（触屏模式技能栏走 DOM 触摸钮，桌面模式绘制带键位的画布技能栏） */
  drawHUD(ctx){
    const mb = IS_TOUCH ? 150 : 200;                 // 血条宽度
    const bx = 10, by = 10, bw = mb, bh = IS_TOUCH ? 13 : 16;
    const lc = bw + (IS_TOUCH ? 18 : 21);            // 等级徽章圆心
    const gx = bw + (IS_TOUCH ? 38 : 44);            // 金币文本偏移
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(bx - 4, by - 4, bw + 8, bh + 24);
    ctx.fillStyle = '#331111'; ctx.fillRect(bx, by, bw, bh);
    const k = Math.max(0, Player.hp / Player.maxHp);
    ctx.fillStyle = k > 0.5 ? '#e03a3a' : '#ff2a2a';
    ctx.fillRect(bx, by, bw * k, bh);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
    ctx.font = 'bold ' + (IS_TOUCH ? 10 : 11) + 'px "Courier New", monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText(Player.hp + ' / ' + Player.maxHp, bx + 4, by + 11);
    ctx.fillStyle = '#ffd76a';
    ctx.beginPath(); ctx.arc(lc, by + 7, IS_TOUCH ? 10 : 11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a3a00'; ctx.font = 'bold ' + (IS_TOUCH ? 10 : 11) + 'px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText('Lv' + PlayerGain.level, lc, by + 11);
    Game.goldFlash = Math.max(0, Game.goldFlash - 0.016);
    ctx.textAlign = 'left'; ctx.font = 'bold ' + (IS_TOUCH ? 12 : 13) + 'px "Courier New", monospace';
    ctx.fillStyle = Game.goldFlash > 0 ? '#fff7c8' : '#ffd76a';
    ctx.fillText('◆ ' + Game.gold, gx, by + 10);
    // 底部经验条（触屏挪高避让技能钮）
    const ex = CONFIG.W/2 - (IS_TOUCH ? 130 : 170), ew = IS_TOUCH ? 260 : 340;
    const ey = IS_TOUCH ? CONFIG.H - 78 : CONFIG.H - 22, eh = IS_TOUCH ? 8 : 10;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(ex - 2, ey - 2, ew + 4, eh + 4);
    ctx.fillStyle = '#14101c'; ctx.fillRect(ex, ey, ew, eh);
    ctx.fillStyle = '#ffd76a';
    ctx.fillRect(ex, ey, ew * Math.min(1, PlayerGain.xp / PlayerGain.need()), eh);
    ctx.strokeStyle = '#8a6a1a'; ctx.lineWidth = 1; ctx.strokeRect(ex, ey, ew, eh);
    // 桌面模式：画布技能栏（带键位/冷却遮罩）；触屏模式由 DOM 按钮接管
    if (!IS_TOUCH){
      const ns = Player.maxSlots(), sbs = 44, gap = 6;
      const sx = CONFIG.W - ns * (sbs + gap) + gap - 12, sy = CONFIG.H - sbs - 12;
      for (let i = 0; i < 4; i++){
        const x = sx + i * (sbs + gap);
        if (i >= ns){
          ctx.fillStyle = 'rgba(0,0,0,.35)';
          ctx.fillRect(x, sy, sbs, sbs);
          ctx.strokeStyle = '#444'; ctx.lineWidth = 2; ctx.strokeRect(x, sy, sbs, sbs);
          ctx.font = '14px serif'; ctx.textAlign = 'center';
          ctx.fillText('🔒', x + sbs/2, sy + sbs/2 + 5);
          continue;
        }
        ctx.fillStyle = 'rgba(0,0,0,.55)';
        ctx.fillRect(x, sy, sbs, sbs);
        ctx.strokeStyle = Player.skillCds[i] > 0 ? '#555' : '#ffd76a';
        ctx.lineWidth = 2; ctx.strokeRect(x, sy, sbs, sbs);
        const sid = Player.skills[i];
        if (sid){
          ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
          ctx.fillText(skillById[sid].icon, x + sbs/2, sy + sbs/2 + 7);
          const kk = Player.skillCds[i] / skillById[sid].cd;
          if (kk > 0){
            ctx.fillStyle = 'rgba(10,10,20,.72)';
            ctx.fillRect(x, sy, sbs, sbs * kk);
            ctx.font = 'bold 13px "Courier New", monospace';
            ctx.fillStyle = '#ffd76a';
            ctx.fillText('' + Math.ceil(Player.skillCds[i]), x + sbs/2, sy + sbs * kk - 6);
          }
        }
        ctx.font = '9px "Courier New", monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#999';
        ctx.fillText(String(i + 1), x + sbs - 3, sy + sbs - 3);
      }
    }
    if (Player.dashT > 0 || Player.invulnT > 0){
      ctx.strokeStyle = 'rgba(255,60,60,' + (0.3 + 0.25*Math.sin(Game.time*22)) + ')';
      ctx.lineWidth = IS_TOUCH ? 6 : 8; ctx.strokeRect(3, 3, CONFIG.W - 6, CONFIG.H - 6);
    }
    if (Waves.bannerT > 0){
      const kk = Waves.bannerT / CONFIG.wave.waveBanner;
      ctx.globalAlpha = Math.min(1, kk * 3);
      ctx.font = 'bold ' + (IS_TOUCH ? 52 : 66) + 'px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      ctx.fillText('WAVE ' + Waves.num, CONFIG.W/2 + 3, CONFIG.H/2 + 3);
      ctx.fillStyle = Waves.isBossWave() ? '#ff5a5a' : '#ffd76a';
      ctx.fillText('WAVE ' + Waves.num, CONFIG.W/2, CONFIG.H/2);
      ctx.globalAlpha = 1;
    }
    if (Game.hurtFlash > 0){
      ctx.fillStyle = 'rgba(255,30,30,' + Math.min(.4, Game.hurtFlash).toFixed(3) + ')';
      ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
    }
  },
};

/* ==================== RENDER：主渲染（主题地板/环境粒子/预警/暗角/震屏/摇杆） ==================== */
const Render = {
  ctx: null, amb: [],
  init(){
    const cv = document.getElementById('game');
    cv.width = CONFIG.W;
    cv.height = CONFIG.H;
    this.ctx = cv.getContext('2d');
  },
  updateAmb(dt){
    const th = CONFIG.themes[Game.themeIndex()];
    if (this.amb.length < CONFIG.perf.ambMax && Math.random() < 0.6){
      const rising = th.particle === 'spark';
      this.amb.push({ x: Math.random()*CONFIG.W,
                      y: rising ? CONFIG.H + 8 : Math.random()*CONFIG.H,
                      a: 0.3 + Math.random()*0.5, s: 1 + Math.random()*2,
                      vy: (rising ? -1 : 1) * (18 + Math.random()*38),
                      vx: (Math.random()-0.5)*22, color: th.pColor, t: 0 });
    }
    for (let i = this.amb.length - 1; i >= 0; i--){
      const p = this.amb[i];
      p.y += p.vy * dt; p.x += p.vx * dt + Math.sin(Game.time*1.5 + i)*0.3;
      p.t += dt;
      if (p.t > 3.5 || p.y < -12 || p.y > CONFIG.H + 12) this.amb.splice(i, 1);
    }
  },
  drawFrame(){
    const ctx = this.ctx;
    ctx.save();
    if (Game.shake > 0)
      ctx.translate((Math.random()-0.5)*Game.shake*CONFIG.perf.shake*2, (Math.random()-0.5)*Game.shake*CONFIG.perf.shake*2);
    const th = CONFIG.themes[Game.themeIndex()];
    ctx.fillStyle = th.floor[0];
    ctx.fillRect(-20, -20, CONFIG.W + 40, CONFIG.H + 40);
    const tile = 32;
    for (let y = -32; y < CONFIG.H; y += tile){
      for (let x = -32; x < CONFIG.W; x += tile){
        if (((x + y) / tile) % 2 < 1) { ctx.fillStyle = th.floor[1]; ctx.fillRect(x, y, tile, tile); }
      }
    }
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1;
    for (let y = -32; y < CONFIG.H; y += tile)
      for (let x = -32; x < CONFIG.W; x += tile) ctx.strokeRect(x, y, tile, tile);
    for (const p of this.amb){
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    ctx.globalAlpha = 1;
    for (const te of Game.telegraphs){
      if (te.t <= 0) continue;
      const blink = 0.5 + 0.4 * Math.sin(Game.time * 16);
      for (const it of te.items){
        ctx.strokeStyle = 'rgba(255,50,40,' + blink.toFixed(3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(it.x, it.y, 26, 0, Math.PI*2); ctx.stroke();
      }
    }
    for (const s of Waves.spawnQueue){
      ctx.font = 'bold 22px "Courier New", monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = '#ff3a2a';
      ctx.fillText('!', s.x, s.y - 14);
      ctx.strokeStyle = 'rgba(255,60,40,.6)';
      ctx.beginPath(); ctx.arc(s.x, s.y, 12, 0, Math.PI*2); ctx.stroke();
    }
    Lava.draw(ctx);
    Pickups.draw(ctx);
    EnemySys.draw(ctx);
    Game.bosses.forEach(b => b.draw(ctx));
    Player.draw(ctx);
    Bullets.draw(ctx);
    Explosions.draw(ctx);
    for (let i = Game.chainAnim.length - 1; i >= 0; i--){
      const c = Game.chainAnim[i];
      c.t -= 1/60;
      if (c.t <= 0){ Game.chainAnim.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(120,220,255,.9)'; ctx.lineWidth = 2;
      for (let j = 1; j < c.points.length; j++){
        ctx.beginPath();
        ctx.moveTo(c.points[j-1].x, c.points[j-1].y);
        ctx.lineTo(c.points[j].x, c.points[j].y);
        ctx.stroke();
      }
    }
    for (let i = Game.frostRings.length - 1; i >= 0; i--){
      const f = Game.frostRings[i];
      f.t -= 1/60; f.r += 340 / 60;
      if (f.t <= 0){ Game.frostRings.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(150,220,255,.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.stroke();
    }
    for (const st of Game.strikeFx){
      if (st.t <= 0) continue;
      ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(st.x, st.y - 260);
      let cx = st.x, cy = st.y - 260;
      while (cy < st.y){ cx += (Math.random()-0.5)*34; cy += 40; ctx.lineTo(cx, cy); }
      ctx.stroke();
    }
    Particles.draw(ctx);
    Floaters.draw(ctx);
    if (IS_TOUCH && Input.joy.active){
      const r = document.getElementById('game').getBoundingClientRect();
      const sc = CONFIG.W / r.width;
      const bx = Input.joy.ox * sc, by = Input.joy.oy * sc;
      const kx = bx + Input.joy.dx * sc, ky = by + Input.joy.dy * sc;
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#aab';
      ctx.beginPath(); ctx.arc(bx, by, 48, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = '#dfe';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(bx, by, 48, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#ffd76a';
      ctx.beginPath(); ctx.arc(kx, ky, 18, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    const grad = ctx.createRadialGradient(CONFIG.W/2, CONFIG.H/2, CONFIG.H*0.35,
                                          CONFIG.W/2, CONFIG.H/2, CONFIG.H*0.9);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(5,2,12,.42)');
    ctx.fillStyle = grad;
    ctx.fillRect(-20, -20, CONFIG.W + 40, CONFIG.H + 40);
    ctx.restore();
    Combo.draw(ctx);
    UI.drawHUD(ctx);
  },
};

/* ==================== GAME：主循环（fixed timestep 60fps）+ 状态机 ==================== */
const Game = {
  state: 'title',
  time: 0, acc: 0, last: 0,
  enemies: [], bosses: [],
  shake: 0, hurtFlash: 0, goldFlash: 0,
  telegraphs: [], strikes: [], strikeFx: [], chainAnim: [], frostRings: [],
  kills: 0, gold: 0,
  shopOpen: false, pendingCards: null, pendingLvl: 0,
  isNewRecord: false, bestNew: 0,

  themeIndex(){ return Math.floor(Math.max(0, Waves.num - 1) / 5) % CONFIG.themes.length; },

  reset(){
    this.enemies = []; this.bosses = [];
    this.telegraphs = []; this.strikes = []; this.strikeFx = [];
    this.chainAnim = []; this.frostRings = []; this.rocks.length = 0;
    this.kills = 0; this.gold = 0; this.shake = 0; this.hurtFlash = 0;
    this.shopOpen = false; this.pendingCards = null; this.pendingLvl = 0;
    this.isNewRecord = false;
    Bullets.pool.clear(); Particles.pool.clear(); Floaters.pool.clear();
    Pickups.list.length = 0; Explosions.list.length = 0; Lava.pools.length = 0;
    Render.amb.length = 0;
    Player.reset(); PlayerGain.reset(); Combo.reset(); Waves.reset();
    Waves.prevName = '史莱姆 × 7';
  },
  startGame(){ this.reset(); this.state = 'play'; UI.hideAll(); Waves.go(); },
  restart(){ AudioSys.resume(); this.startGame(); },
  togglePause(){
    if (this.state === 'play'){ this.state = 'pause'; UI.showPause(); }
    else if (this.state === 'pause'){ this.state = 'play'; UI.hideAll(); }
  },
  spawnEnemy(def, x, y, opts){
    const e = makeEnemy(def, x, y, opts);
    if (def.type === 'bomber'){ e.def.bombWarn = 0.6; }
    if (def.type === 'bull')  { e.def.chargeWarn = 0.8; }
    this.enemies.push(e);
  },
  spawnBoss(key){
    const cfg = CONFIG.boss[key];
    const wave = Waves.num;
    this.bosses.push(new Boss(key, cfg, wave));
    AudioSys.play('boss');
    Floaters.add(CONFIG.W/2, CONFIG.H/2 - 40, cfg.name + ' 降临！', '#ff5a5a', 20, true);
  },
  damageEnemy(e, dmg, sx, sy, kb){
    if (!e.alive) return;
    const crit = Player.lastHitCrit;
    Player.lastHitCrit = false;
    const final = Math.max(1, Math.round(dmg * Combo.damageMult()));
    e.hp -= final;
    e.flash = CONFIG.melee.hitFlash;
    if (kb){
      const a = Math.atan2(e.y - sy, e.x - sx);
      e.kx += Math.cos(a) * kb; e.ky += Math.sin(a) * kb;
    }
    let col = '#ffffff';
    if (final >= 30) col = '#ffd76a';
    if (final >= 60) col = '#ff9a40';
    if (final >= 100) col = '#ff4a4a';
    if (crit) col = '#ff6a3a';
    Floaters.add(e.x, e.y - e.r - 6, final + (crit ? '!' : ''), col, crit ? 19 : 13, crit);
    Combo.add();
    this.shake = Math.min(6, this.shake + 1.1);
    if (e.hp <= 0) this.killEnemy(e, false);
  },
  killEnemy(e, silent){
    if (!e.alive) return;
    e.alive = false;
    this.kills++;
    const isBoss = !!e.boss;
    const def = e.def;
    Particles.burst(e.x, e.y, e.elite || isBoss ? 16 : 9, e.color || '#e8e8f0', 110, .42, 40);
    if (!silent){
      if (isBoss) AudioSys.play('levelUp');
      else if (def.type === 'tiny') AudioSys.play('split');
      else AudioSys.play('enemyDie');
    }
    if (def.split){
      for (let i = 0; i < 2; i++){
        const t = makeEnemy(CONFIG.enemy.tiny, e.x + (i === 0 ? -11 : 11), e.y + 4, null);
        this.enemies.push(t);
      }
      AudioSys.play('split');
    }
    if (isBoss){ this.gold += CONFIG.boss.gold; Game.goldFlash = 0.8; AudioSys.play('coin'); }
    else if (e.elite){
      const gv = Math.round((10 + Math.random()*6) * Player.goldMult());
      this.gold += gv; Game.goldFlash = 0.8;
      Floaters.add(e.x, e.y - 10, '◆' + gv, '#ffd76a', 14, false);
      AudioSys.play('coin');
    } else {
      const gv = def.gold[0] + Math.floor(Math.random() * (def.gold[1] - def.gold[0] + 1));
      Pickups.add('gold', e.x + (Math.random()*18-9), e.y + (Math.random()*18-9), gv);
    }
    if (isBoss) PlayerGain.gain(e.xp);
    else Pickups.add('xp', e.x + (Math.random()*14-7), e.y + (Math.random()*14-7), e.xp);
    if (!isBoss){
      const r = Math.random();
      if (r < CONFIG.drops.heart) Pickups.add('heart', e.x, e.y);
      else if (r < CONFIG.drops.heart + CONFIG.drops.magnet) Pickups.add('magnet', e.x, e.y);
      else if (r < CONFIG.drops.heart + CONFIG.drops.magnet + CONFIG.drops.bomb) Pickups.add('bomb', e.x, e.y);
    }
    if (Player.up.drain > 0){ Player.hp = Math.min(Player.maxHp, Player.hp + 2 * Player.up.drain); }
    if (isBoss){ this.bosses = this.bosses.filter(b => b !== e); }
  },
  damageAllEnemies(dmg, sx, sy){
    this.enemies.forEach(e => { if (e.alive) this.damageEnemy(e, dmg, sx, sy, 0); });
    this.bosses.forEach(b => { if (b.alive) this.damageEnemy(b, dmg, b.x, b.y, 0); });
  },
  explodeAt(x, y, radius, dmg){ Explosions.spawn(x, y, radius, dmg); },
  nearestEnemy(x, y){
    let best = null, bd = 1e9;
    for (const e of this.enemies){
      if (!e.alive) continue;
      const d = Collide.dist(x, y, e.x, e.y);
      if (d < bd){ bd = d; best = e; }
    }
    for (const b of this.bosses){
      if (!b.alive) continue;
      const d = Collide.dist(x, y, b.x, b.y);
      if (d < bd){ bd = d; best = b; }
    }
    return best;
  },
  findEnemyAt(x, y, radius){
    for (const e of this.enemies){
      if (!e.alive) continue;
      if (Collide.dist(x, y, e.x, e.y) < radius + e.r) return e;
    }
    for (const b of this.bosses){
      if (!b.alive) continue;
      if (Collide.dist(x, y, b.x, b.y) < radius + b.r) return b;
    }
    return null;
  },
  hurtPlayer(dmg, sx, sy){
    if (Player.invulnNow()) return;
    let d = dmg;
    for (let i = 0; i < Player.up.armor; i++) d *= 0.92;
    d = Math.max(1, Math.round(d));
    Player.hp -= d;
    Player.invulnT = CONFIG.player.invuln;
    this.hurtFlash = 0.5;
    this.shake = Math.min(9, this.shake + 4);
    AudioSys.play('hurt');
    Floaters.add(Player.x, Player.y - 24, '-' + d, '#ff4a4a', 15, false);
    if (Player.hp <= 0) this.die();
  },
  die(){
    Player.hp = 0;
    this.state = 'dead';
    const prevBest = Save.getBest();
    Save.saveBest(Waves.num);
    this.bestNew = Math.max(prevBest, Waves.num);
    this.isNewRecord = Waves.num > prevBest;
    UI.showDead();
    AudioSys.play('hurt');
  },
  triggerLevelUp(){
    if (this.state === 'dead') return;
    this.pendingLvl++;
    if (this.state === 'levelup') return;
    this.beginLevelUp();
  },
  beginLevelUp(){
    this.pendingLvl--;
    this.state = 'levelup';
    this.pendingCards = rollCards();
    UI.showLevelUp(this.pendingCards);
    AudioSys.play('levelUp');
  },
  pickCard(c){
    AudioSys.play('card');
    if (c.kind === 'up'){
      upDefById[c.id].apply();
      this.shake = Math.min(4, this.shake + 1.5);
    } else {
      const sid = c.id;
      if (sid === 'extra' && !Player.up.kai4){
        Player.up.kai4 = 1;
      } else if (Player.ownsSkill(sid) || Player.freeSlot() < 0){
        this.empowerRandomSkill();
      } else {
        Player.skills[Player.freeSlot()] = sid;
      }
    }
    this.state = 'play';
    this.pendingCards = null;
    UI.hideAll();
    if (this.pendingLvl > 0){
      this.beginLevelUp();
    } else if (this.shopOpen && Waves.state === 'inter'){
      UI.showShop();
    }
  },
  empowerRandomSkill(){
    const equipped = Player.skills.filter(s => s && s !== 'extra');
    if (!equipped.length) return;
    const sid = equipped[Math.floor(Math.random() * equipped.length)];
    Player.empower[sid] = (Player.empower[sid] || 0) + 0.2;
    Floaters.add(Player.x, Player.y - 30, skillById[sid].name + ' 威力 +20%', '#c0b0ff', 13, false);
  },
  openShop(){ this.shopOpen = true; Shop.refresh(); UI.showShop(); },
  closeShop(){
    this.shopOpen = false;
    UI.hideAll();
    if (Waves.state === 'inter' && this.state !== 'dead') UI.showInter();
  },
  pressSkill(n){ useSkillAt(n - 1); },
  sendLava(x, y){ Lava.send(x, y); },
  update(dt){
    this.time += dt;
    Render.updateAmb(dt);
    Particles.update(dt);
    Floaters.update(dt);
    if (this.state === 'play'){
      if (Waves.state === 'fight'){
        Player.update(dt);
        Combo.tick(dt);
        EnemySys.update(dt);
        Bullets.update(dt);
        Explosions.update(dt);
        Pickups.update(dt);
        Lava.update(dt);
        for (const b of this.bosses) b.update(dt, this);
        for (let i = this.strikes.length - 1; i >= 0; i--){
          const s = this.strikes[i];
          s.delay -= dt;
          if (s.delay <= 0){
            this.strikes.splice(i, 1);
            this.strikeFx.push({ x: s.x, y: s.y, t: 0.3 });
            this.enemies.forEach(e => {
              if (e.alive && Collide.dist(e.x, e.y, s.x, s.y) < 55)
                this.damageEnemy(e, Player.atk*1.2*Player.skillMult('thunder'), s.x, s.y, 40);
            });
            this.bosses.forEach(b => {
              if (b.alive && Collide.dist(b.x, b.y, s.x, s.y) < 60)
                this.damageEnemy(b, Player.atk*1.2*Player.skillMult('thunder'), s.x, s.y, 30);
            });
            Particles.burst(s.x, s.y, 10, '#ffd76a', 110, .3);
            AudioSys.play('explode');
          }
        }
        for (let i = this.strikeFx.length - 1; i >= 0; i--){
          this.strikeFx[i].t -= dt;
          if (this.strikeFx[i].t <= 0) this.strikeFx.splice(i, 1);
        }
        for (let i = this.rocks.length - 1; i >= 0; i--){
          const rk = this.rocks[i];
          rk.delay -= dt;
          if (rk.delay <= 0){
            this.rocks.splice(i, 1);
            Particles.burst(rk.x, rk.y, 12, '#ffb060', 140, .4);
            this.shake = Math.min(8, this.shake + 3);
            if (!Player.invulnNow() && Collide.dist(rk.x, rk.y, Player.x, Player.y) < 45)
              this.hurtPlayer(12, rk.x, rk.y);
          }
        }
        for (let i = this.telegraphs.length - 1; i >= 0; i--){
          this.telegraphs[i].t -= dt;
          if (this.telegraphs[i].t <= 0) this.telegraphs.splice(i, 1);
        }
      }
      Waves.update(dt);
      Waves.tickAuto(dt);
    }
    this.shake = Math.max(0, this.shake - dt * 18);
    this.hurtFlash = Math.max(0, this.hurtFlash - dt * 1.8);
    Explosions.update(dt);
  },
  loop(ts){
    if (!this.last) this.last = ts;
    let delta = (ts - this.last) / 1000;
    this.last = ts;
    if (delta > 0.25) delta = 0.25;
    this.acc += delta;
    let n = 0;
    while (this.acc >= CONFIG.STEP && n < 4){ this.update(CONFIG.STEP); this.acc -= CONFIG.STEP; n++; }
    Render.drawFrame();
    UI.refreshTouch();
    requestAnimationFrame((t) => this.loop(t));
  },
};
Game.rocks = [];

/* ==================== Boss 实体：三 Boss 阶段化 AI（60%/30% 行为切换） ==================== */
class Boss {
  constructor(key, cfg, wave){
    this.key = key; this.name = cfg.name;
    this.hp = cfg.baseHp + wave * cfg.perHp;
    this.maxHp = this.hp;
    this.atk = Math.round(12 + wave * 1.5);
    this.wave = wave;
    this.x = CONFIG.W/2; this.y = CONFIG.H/2 - 40;
    this.r = 26; this.alive = true; this.boss = true;
    this.flash = 0; this.frozen = 0; this.kx = 0; this.ky = 0;
    this.st = 'intro'; this.stT = 1.0; this.phase = 1; this.t = 0; this.seed = Math.random()*100;
    this.scale = 4;
    this.sprName = key === 'guard' ? 'boss_guard' : key === 'lich' ? 'boss_lich' : 'boss_dragon';
    this.xp = CONFIG.boss.expBase + wave * CONFIG.boss.expPer;
    this.speed = key === 'guard' ? 95 : key === 'lich' ? 62 : 78;
    this.color = key === 'guard' ? '#90a8c8' : key === 'lich' ? '#38c0a0' : '#f06a30';
    this.id = (Math.random()*1e9)|0;
    this.cd1 = 0.6; this.cd2 = 0.8;
  }
  update(dt, game){
    if (!this.alive) return;
    this.t += dt;
    this.flash = Math.max(0, this.flash - dt);
    this.phase = this.hp / this.maxHp < 0.3 ? 3 : this.hp / this.maxHp < 0.6 ? 2 : 1;
    if (this.st === 'intro'){
      this.y += (CONFIG.H/2 - this.y) * dt * 2;
      this.stT -= dt;
      if (this.stT <= 0) this.st = 'idle';
      return;
    }
    const dx = Player.x - this.x, dy = Player.y - this.y;
    const dist = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    if (!Player.invulnNow() && Collide.circle(this.x, this.y, this.r, Player.x, Player.y, Player.hitRadius())){
      game.hurtPlayer(this.atk, this.x, this.y);
    }
    if (this.key === 'guard')  this.updateGuard(dt, game, ang, dist);
    if (this.key === 'lich')   this.updateLich(dt, game, ang, dist);
    if (this.key === 'dragon') this.updateDragon(dt, game, ang, dist);
    if (this.hp <= 0){ this.alive = false; game.killEnemy(this, false); }
  }
  bossBullet(game, ang, spd, color, dmg){
    Bullets.add({ x:this.x, y:this.y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, dmg,
                  life:3.5, color, type:'enemy', aoe:0, pierce:0, radius:4, rot:ang });
  }
  /* --- 回廊守卫：追踪+砸地红圈 → P2 环形弹幕 → P3 召唤+冲锋 --- */
  updateGuard(dt, game, ang, dist){
    if (this.st === 'slam'){
      if (this.stT <= 0){
        this.st = 'idle'; this.stT = 1.5;
        game.shake = Math.min(10, game.shake + 5);
        Particles.burst(this.x, this.y, 16, '#9aa8c8', 170, .42);
        if (!Player.invulnNow() && Collide.dist(this.x, this.y, Player.x, Player.y) < 92)
          game.hurtPlayer(this.atk * 1.4, this.x, this.y);
        if (this.phase >= 2){
          const ring = Math.round(16 * CONFIG.perf.bossBullets);
          for (let i = 0; i < ring; i++){
            const a = i / Math.max(1, ring) * Math.PI * 2;
            this.bossBullet(game, a, 190, '#c0d0f0', this.atk * 0.55);
          }
          AudioSys.play('fire');
        }
      }
    } else {
      this.x += Math.cos(ang) * this.speed * dt;
      this.y += Math.sin(ang) * this.speed * dt;
      if (dist < 115){
        this.st = 'slam'; this.stT = 0.8;
        game.telegraphs.push({ kind:'slam', items:[{ x:this.x, y:this.y }], t: 0.8 });
        AudioSys.play('thunder');
      }
      if (this.phase === 3){
        this.stT -= dt;
        if (this.stT <= 0){
          this.stT = 5.5;
          for (let i = 0; i < 3; i++)
            game.spawnEnemy(CONFIG.enemy.skeleton, this.x + (Math.random()*44-22), this.y + (Math.random()*44-22), null);
          AudioSys.play('clone');
        }
      }
    }
  }
  /* --- 巫妖王：三连弹幕 → 召唤骷髅 → 瞬移+冰锥冻结 --- */
  updateLich(dt, game, ang, dist){
    this.cd1 -= dt;
    if (this.cd1 <= 0){
      this.cd1 = this.phase >= 3 ? 1.7 : this.phase === 2 ? 2.2 : 2.8;
      const n = this.phase >= 2 ? 5 : 3;
      for (let i = 0; i < n; i++){
        const a = ang + (i - (n-1)/2) * 0.14;
        this.bossBullet(game, a, 215, '#6ff0d0', this.atk * 0.55);
      }
      AudioSys.play('fire');
      if (this.phase >= 2 && Math.random() < 0.55){
        for (let i = 0; i < 2; i++)
          game.spawnEnemy(CONFIG.enemy.skeleton, this.x + (Math.random()*50-25), this.y + (Math.random()*50-25), null);
        AudioSys.play('clone');
      }
      if (this.phase === 3 && Math.random() < 0.5){
        Particles.burst(this.x, this.y, 12, '#38c0a0', 90, .35);
        const a2 = Math.random()*Math.PI*2;
        this.x = Math.max(40, Math.min(CONFIG.W-40, Player.x + Math.cos(a2)*170));
        this.y = Math.max(40, Math.min(CONFIG.H-40, Player.y + Math.sin(a2)*170));
        Particles.burst(this.x, this.y, 12, '#38c0a0', 90, .35);
        AudioSys.play('clone');
      }
      if (this.phase === 3 && Math.random() < 0.4){
        game.telegraphs.push({ kind:'slam', items:[{ x:Player.x, y:Player.y }], t: 0.55 });
        game.frostRings.push({ x:Player.x, y:Player.y, r:0, t:0.4 });
        if (!Player.invulnNow() && Collide.dist(this.x, this.y, Player.x, Player.y) < 260)
          game.hurtPlayer(this.atk * 0.9, this.x, this.y);
        AudioSys.play('freeze');
      }
    }
    if (dist < 200){ this.x -= Math.cos(ang)*this.speed*dt; this.y -= Math.sin(ang)*this.speed*dt; }
    else if (dist > 320){ this.x += Math.cos(ang)*this.speed*dt; this.y += Math.sin(ang)*this.speed*dt; }
  }
  /* --- 熔岩巨龙：锥形喷火 → 熔岩池 → 俯冲+全场落石 --- */
  updateDragon(dt, game, ang, dist){
    this.cd1 -= dt;
    if (this.st === 'dive'){
      this.x += Math.cos(this.diveAng) * 280 * dt;
      this.y += Math.sin(this.diveAng) * 280 * dt;
      this.stT -= dt;
      if (this.stT <= 0) this.st = 'idle';
      return;
    }
    this.y += Math.cos(ang + Math.sin(this.t*4)*0.25) * this.speed * dt;
    this.x += Math.sin(ang + Math.sin(this.t*4)*0.25) * this.speed * dt;
    if (this.cd1 <= 0){
      this.cd1 = 2.4;
      const cone = Math.round(6 * CONFIG.perf.bossBullets);
      for (let i = 0; i < cone; i++){
        const a = ang + (i - (cone-1)/2) * 0.14;
        this.bossBullet(game, a, 235, '#ff8a40', this.atk * 0.6);
      }
      AudioSys.play('fire');
      if (this.phase >= 2){
        game.sendLava(this.x, this.y);
        AudioSys.play('explode');
      }
      if (this.phase === 3){
        if (Math.random() < 0.7){
          this.st = 'dive'; this.stT = 0.9; this.diveAng = ang;
        }
        AudioSys.play('thunder');
        for (let i = 0; i < 3; i++){
          const rx = Math.random()*(CONFIG.W-100) + 50, ry = Math.random()*(CONFIG.H*0.55) + 50;
          game.telegraphs.push({ kind:'slam', items:[{ x:rx, y:ry }], t: 0.6 });
          game.rocks.push({ x:rx, y:ry, delay: 0.6 });
        }
      }
    }
  }
  draw(ctx){
    const bw = IS_TOUCH ? 240 : 300, bh = IS_TOUCH ? 9 : 10;
    const bx = CONFIG.W/2 - bw/2;
    const by = IS_TOUCH ? CONFIG.H - 80 : CONFIG.H - 62;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx-2, by-2, bw+4, bh+4);
    ctx.fillStyle = '#5a1a1a'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#ff3a3a';
    ctx.fillRect(bx, by, bw * Math.max(0, this.hp / this.maxHp), bh);
    ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
    ctx.font = 'bold ' + (IS_TOUCH ? 11 : 13) + 'px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText(this.name + '（阶段' + this.phase + '）', CONFIG.W/2, by - 6);
    if (this.frozen > 0){
      ctx.fillStyle = 'rgba(120,200,255,.22)';
      ctx.beginPath(); ctx.arc(this.x, this.y, 30, 0, Math.PI*2); ctx.fill();
    }
    drawSprite(ctx, this.sprName, this.x, this.y, this.scale, this.flash > 0, false);
  }
}

/* ==================== 熔岩池（范围持续灼烧） ==================== */
const Lava = {
  pools: [],
  send(x, y){ this.pools.push({ x, y, r: 0, t: 0, life: 4 }); },
  update(dt){
    for (let i = this.pools.length - 1; i >= 0; i--){
      const p = this.pools[i];
      p.t += dt;
      if (p.t >= p.life){ this.pools.splice(i, 1); continue; }
      p.r = Math.min(60, p.r + 120 * dt);
      if (Math.random() < dt*10)
        Particles.add(p.x + (Math.random()-0.5)*p.r*1.4, p.y + (Math.random()-0.5)*p.r*1.4,
                      (Math.random()-0.5)*50, -90, .5, '#ff7a30', 3);
      if (Game.state === 'play' && Collide.dist(p.x, p.y, Player.x, Player.y) < p.r && !Player.invulnNow()){
        if (!p.dmgT || p.dmgT <= 0){ p.dmgT = 0.5; Game.hurtPlayer(10, p.x, p.y); }
        p.dmgT -= dt;
      }
    }
  },
  draw(ctx){
    for (const p of this.pools){
      ctx.fillStyle = 'rgba(255,110,40,.45)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,160,80,.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.stroke();
    }
  },
};

/* ==================== 存档：localStorage 最高纪录 ==================== */
const Save = {
  key: 'pixelHeroBestWave',
  getBest(){ try { return parseInt(localStorage.getItem(this.key) || '0', 10) || 0; } catch(e){ return 0; } },
  saveBest(w){
    try { const best = Math.max(this.getBest(), w); localStorage.setItem(this.key, String(best)); return best; }
    catch(e){ return Math.max(this.getBest(), w); }
  },
};

/* ==================== 装配：事件绑定 + 竖屏检测 + 启动 ==================== */
(function boot(){
  Render.init();
  Input.init();
  UI.init();
  // 窗口/竖屏适配
  const fit = () => {
    const cv = document.getElementById('game');
    const s = Math.min(window.innerWidth / CONFIG.W, window.innerHeight / CONFIG.H);
    cv.style.width  = Math.floor(CONFIG.W * s) + 'px';
    cv.style.height = Math.floor(CONFIG.H * s) + 'px';
    if (IS_TOUCH){
      const isPortrait = window.innerHeight > window.innerWidth;
      document.getElementById('lay-rotate').classList.toggle('show', isPortrait);
    }
  };
  window.addEventListener('resize', fit);
  fit();
  // 标题启动：首次按键/点击/触摸 → 创建 AudioContext 并进入游戏
  window.addEventListener('keydown', function titleKeyStart(){
    AudioSys.init(); AudioSys.resume();
    if (Game.state === 'title'){
      Game.startGame();
      window.removeEventListener('keydown', titleKeyStart);
      window.removeEventListener('touchstart', titleTouchStart);
      window.removeEventListener('mousedown', titleMouseStart);
    }
  });
  window.addEventListener('touchstart', function titleTouchStart(){
    AudioSys.init(); AudioSys.resume();
    if (Game.state === 'title'){
      Game.startGame();
      window.removeEventListener('keydown', titleKeyStart);
      window.removeEventListener('touchstart', titleTouchStart);
      window.removeEventListener('mousedown', titleMouseStart);
    }
  }, { passive:true });
  window.addEventListener('mousedown', function titleMouseStart(){
    AudioSys.init(); AudioSys.resume();
    if (Game.state === 'title'){
      Game.startGame();
      window.removeEventListener('keydown', titleKeyStart);
      window.removeEventListener('touchstart', titleTouchStart);
      window.removeEventListener('mousedown', titleMouseStart);
    }
  });
  // 数字键：选卡(1-3) / 技能(1-4)
  window.addEventListener('keydown', (e) => {
    const n = parseInt(e.key, 10);
    if (!isNaN(n) && n >= 1 && n <= 4){
      if (Game.state === 'levelup' && n <= 3) UI.pickCardByNumber(n);
      else if (Game.state === 'play') Game.pressSkill(n);
    }
  }, false);
  // 空格：休整开波 / 关闭商店 / 死亡重开
  window.addEventListener('keydown', (e) => {
    if (e.key !== ' ') return;
    e.preventDefault();
    if (Game.state === 'dead') Game.restart();
    else if (Game.state === 'play' && Waves.state === 'inter') Waves.go();
    else if (Game.shopOpen) Game.closeShop();
  }, false);
  // 暂停层点击恢复（准备区面板避免拦截按钮点击）
  document.getElementById('lay-pause').addEventListener('click', (e) => {
    if (e.target && e.target.id === 'resume-btn') return;
  });
  // 启动主循环
  Game.last = 0;
  requestAnimationFrame((t) => Game.loop(t));
})();
</script>
